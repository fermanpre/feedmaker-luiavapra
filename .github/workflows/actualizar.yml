name: Actualizar feeds

on:
  schedule:
    - cron: "23 5 * * *"   # cada día a las 05:23 UTC
  workflow_dispatch:        # ejecución manual desde la pestaña Actions
  push:
    paths:
      - feeds.json          # al añadir o quitar webs se regeneran los feeds

permissions:
  contents: write

concurrency:
  group: actualizar-feeds
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Generar feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEEDMAKER_MAX_LLAMADAS: "60"
        run: python generar.py feeds.json

      # estado.json lleva la fecha de generación, así que cambia cada día: el commit diario
      # mantiene activo el repositorio (GitHub desactiva los workflows programados tras 60 días sin actividad).
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs datos
          git commit -m "Actualizar feeds" || echo "Sin cambios"
          git pull --rebase origin main
          git push

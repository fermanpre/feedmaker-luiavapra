name = "feedmaker"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
REPO = "fermanpre/feedmaker"
ORIGEN_PERMITIDO = "https://fermanpre.github.io"
MAX_ALTAS_DIA = "30"
MAX_FALLOS_HORA = "5"

# Opcional, para limitar intentos fallidos y altas por día. Crea el espacio con:
#   npx wrangler kv namespace create LIMITES
# y pega aquí el id que devuelva, quitando las almohadillas:
# [[kv_namespaces]]
# binding = "LIMITES"
# id = "PEGA_AQUI_EL_ID"
